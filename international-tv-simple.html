<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>International Dashboard - TV</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0b0b;
      overflow: hidden;
    }
    /* Stage holds both iframes stacked on top of each other, filling the screen */
    #stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
    }
    #stage iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      opacity: 0;
      transition: opacity 800ms ease-in-out;
    }
    #stage iframe.active {
      opacity: 1;
    }
    /* One-time click prompt to enter fullscreen (browser requires a user gesture) */
    #fsPrompt {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(5, 13, 28, 0.92);
      color: #d9d9d9;
      font-family: Arial, sans-serif;
      font-size: 28px;
      letter-spacing: 0.5px;
      cursor: pointer;
      z-index: 10;
    }
    #fsPrompt.hidden { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <iframe id="frameA" title="International Dashboard" allowfullscreen="true"></iframe>
    <iframe id="frameB" title="International Dashboard" allowfullscreen="true"></iframe>
  </div>

  <div id="fsPrompt">Click anywhere to start the dashboard</div>

<script>
  // Base "Publish to web" URL (your r=... token stays the same)
  const baseUrl =
    "https://app.powerbi.com/view?r=eyJrIjoiYWM2YTcwNzMtZGE0Mi00Y2EzLThiNjctMjMzYTczM2RmNWRmIiwidCI6IjNiYWI4YzcwLWQyOTktNDdjMy1iZWQ5LWNjNWMzMTBlYWUxNSIsImMiOjh9";

  // How long each page stays on screen (15 seconds).
  const rotateEveryMs = 15000;
  // How early to start loading the NEXT page behind the current one (must be < rotateEveryMs).
  // Gives Power BI time to render before the fade, so the swap is seamless.
  const preloadLeadMs = 4000;

  // Your pages (name + pageName) — rename each "name" to match your actual page titles
  const pages = [
    { name: "Page 1",  pageName: "1d8b8a7ba08b9bade097" },
    { name: "Page 2",  pageName: "266e20d502510de09ba2" },
    { name: "Page 3",  pageName: "90fb418330bd5633eccd" },
    { name: "Page 4",  pageName: "e41b3d0b5250a6174e2a" },
    { name: "Page 5",  pageName: "ff7ac899e4ab084007aa" },
    { name: "Page 6",  pageName: "879f5f8e2e1273a60560" },
    { name: "Page 7",  pageName: "93235fda0ad08dd18a67" },
    { name: "Page 8",  pageName: "298cb8a65aecc40e6607" },
    { name: "Page 9",  pageName: "bf3446ed28a52db06376" },
    { name: "Page 10", pageName: "ba36259d3d9d09d340bb" },
    { name: "Page 11", pageName: "70b03d075fcd4783342c" },
    { name: "Page 12", pageName: "200db640638d470e0539" },
    { name: "Page 13", pageName: "4f8b2a096ee23c5bb032" },
    { name: "Page 14", pageName: "8dbda9a60c48397beab0" },
    { name: "Page 15", pageName: "2e16d176954087de0196" }
  ];

  const frames = [document.getElementById("frameA"), document.getElementById("frameB")];
  const prompt = document.getElementById("fsPrompt");

  function urlFor(index) {
    return `${baseUrl}&pageName=${encodeURIComponent(pages[index].pageName)}`;
  }

  let current = 0;     // index into pages[]
  let visible = 0;     // which frame (0 or 1) is currently showing

  function startShow() {
    // Load first page into frame A and show it.
    frames[0].src = urlFor(0);
    frames[0].classList.add("active");
    scheduleNext();
  }

  function scheduleNext() {
    const nextIndex = (current + 1) % pages.length;
    const hiddenFrame = 1 - visible;

    // Start loading the next page (hidden) a few seconds before the swap.
    setTimeout(() => {
      frames[hiddenFrame].src = urlFor(nextIndex);
    }, rotateEveryMs - preloadLeadMs);

    // At the swap point, fade to the freshly-loaded hidden frame.
    setTimeout(() => {
      frames[hiddenFrame].classList.add("active");
      frames[visible].classList.remove("active");
      visible = hiddenFrame;
      current = nextIndex;
      scheduleNext();
    }, rotateEveryMs);
  }

  // Fullscreen on first click (required user gesture), then start.
  function goFullscreenAndStart() {
    const el = document.documentElement;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { req.call(el); } catch (e) { /* ignore if blocked */ } }
    prompt.classList.add("hidden");
    startShow();
  }

  prompt.addEventListener("click", goFullscreenAndStart);
</script>
</body>
</html>
